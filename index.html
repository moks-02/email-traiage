<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Triage Assistant - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #1a1c2c 0%, #4a192c 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        /* Ambient background blobs */
        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
            opacity: 0.6;
        }

        .blob-1 {
            top: -10%;
            left: -10%;
            width: 500px;
            height: 500px;
            background: #ff00cc;
            animation: float 8s ease-in-out infinite;
        }

        .blob-2 {
            bottom: -10%;
            right: -10%;
            width: 600px;
            height: 600px;
            background: #3333ff;
            animation: float 10s ease-in-out infinite reverse;
        }

        .blob-3 {
            top: 40%;
            left: 40%;
            width: 300px;
            height: 300px;
            background: #00ffcc;
            animation: float 12s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translate(0, 0); }
            50% { transform: translate(30px, 50px); }
            100% { transform: translate(0, 0); }
        }

        .container {
            max-width: 550px;
            width: 100%;
            position: relative;
            z-index: 1;
        }

        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 50px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            animation: slideUp 0.5s ease-out;
            color: white;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .logo {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo-icon {
            font-size: 4em;
            margin-bottom: 15px;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
        }

        h1 {
            color: #ffffff;
            font-size: 2em;
            margin-bottom: 10px;
            text-align: center;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
            font-weight: 700;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.8);
            text-align: center;
            margin-bottom: 40px;
            line-height: 1.6;
            font-weight: 300;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            color: rgba(255, 255, 255, 0.9);
            font-weight: 500;
            margin-bottom: 8px;
            font-size: 0.95em;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
        }

        input, select {
            width: 100%;
            padding: 15px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            font-size: 1em;
            color: white;
            transition: all 0.3s;
            outline: none;
        }

        input:focus, select:focus {
            background: rgba(0, 0, 0, 0.3);
            border-color: rgba(255, 255, 255, 0.5);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.1);
        }
        
        /* Placeholder styling */
        ::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }
        
        /* Select dropdown styling options (tricky in standard select, but basic support) */
        select option {
            background: #2d3748;
            color: white;
        }

        .btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1) 0%, rgba(255, 255, 255, 0.05) 100%);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
            backdrop-filter: blur(5px);
        }

        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.2) 0%, rgba(255, 255, 255, 0.1) 100%);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            border-color: rgba(255, 255, 255, 0.4);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: transparent;
            color: rgba(255, 255, 255, 0.8);
            border: 1px dashed rgba(255, 255, 255, 0.3);
            margin-top: 15px;
            font-size: 0.9em;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.05);
            color: white;
            border-color: rgba(255, 255, 255, 0.6);
        }

        .help-box {
            background: rgba(255, 255, 255, 0.05);
            border-left: 4px solid #00ffcc;
            padding: 15px;
            border-radius: 8px;
            margin-top: 25px;
            display: none;
        }

        .help-box.show {
            display: block;
            animation: slideDown 0.3s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                max-height: 0;
            }
            to {
                opacity: 1;
                max-height: 500px;
            }
        }

        .help-box h3 {
            color: #00ffcc;
            margin-bottom: 10px;
            font-size: 1em;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.3);
        }

        .help-box ol {
            margin-left: 20px;
            color: rgba(255, 255, 255, 0.8);
            line-height: 1.8;
        }

        .help-box a {
            color: #00ffcc;
            text-decoration: none;
            font-weight: 600;
        }

        .help-box a:hover {
            text-decoration: underline;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
        }

        .status-message {
            padding: 12px;
            border-radius: 8px;
            margin-top: 20px;
            display: none;
            animation: slideDown 0.3s ease-out;
            backdrop-filter: blur(10px);
        }

        .status-message.show {
            display: block;
        }

        .status-success {
            background: rgba(46, 213, 115, 0.2);
            color: #2ed573;
            border: 1px solid rgba(46, 213, 115, 0.3);
        }

        .status-error {
            background: rgba(255, 71, 87, 0.2);
            color: #ff4757;
            border: 1px solid rgba(255, 71, 87, 0.3);
        }

        .status-info {
            background: rgba(112, 161, 255, 0.2);
            color: #70a1ff;
            border: 1px solid rgba(112, 161, 255, 0.3);
        }

        /* Loading spinner update */
        .loading-spinner {
            border-color: rgba(255, 255, 255, 0.1);
            border-top-color: #00ffcc;
        }

        .footer {
            text-align: center;
            margin-top: 30px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.9em;
        }

        .footer a {
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            transition: all 0.3s;
        }

        .footer a:hover {
            color: white;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        .password-toggle {
            position: relative;
        }

        .password-toggle input {
            padding-right: 45px;
        }

        .toggle-visibility {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.2em;
            color: rgba(255, 255, 255, 0.5);
            transition: color 0.3s;
        }

        .toggle-visibility:hover {
            color: white;
        }

        .demo-mode-link {
            text-align: center;
            margin-top: 20px;
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.9em;
        }

        .demo-mode-link a {
            color: #00ffcc;
            text-decoration: none;
            font-weight: 600;
        }

        .demo-mode-link a:hover {
            text-decoration: underline;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.3);
        }
    </style>
</head>
<body>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
    <div class="container">
        <div class="card">
            <div class="logo">
                <div class="logo-icon">📧</div>
                <h1>Email Triage Assistant</h1>
                <p class="subtitle">Connect your email account to get started with AI-powered email management</p>
            </div>

            <!-- Login Form -->
            <form id="loginForm">
                <div class="form-group">
                    <label for="emailAddress">Email Address</label>
                    <input 
                        type="email" 
                        id="emailAddress" 
                        placeholder="your.email@gmail.com"
                        required
                        autocomplete="email"
                    >
                </div>

                <div class="form-group">
                    <label for="provider">Email Provider</label>
                    <select id="provider" required>
                        <option value="">Auto-detect</option>
                        <option value="gmail">Gmail</option>
                        <option value="outlook">Outlook / Hotmail</option>
                        <option value="yahoo">Yahoo Mail</option>
                        <option value="icloud">iCloud Mail</option>
                        <option value="aol">AOL Mail</option>
                        <option value="custom">Custom IMAP Server</option>
                    </select>
                </div>

                <!-- Google OAuth button – shown when Gmail is selected -->
                <div id="gmailOAuthSection" style="display:none; margin-bottom: 16px;">
                    <a href="http://localhost:8000/api/auth/gmail" class="btn" id="gmailOAuthBtn"
                       style="display:flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;background:linear-gradient(135deg,#4285F4,#34A853);">
                        <svg width="20" height="20" viewBox="0 0 48 48" style="flex-shrink:0">
                            <path fill="#fff" d="M44.5 20H24v8.5h11.8C34.1 33.9 29.6 37 24 37c-7.2 0-13-5.8-13-13s5.8-13 13-13c3.1 0 5.9 1.1 8.1 2.9l6.4-6.4C34.6 5.1 29.6 3 24 3 12.4 3 3 12.4 3 24s9.4 21 21 21c10.5 0 20-7.6 20-21 0-1.4-.2-2.7-.5-4z"/>
                        </svg>
                        Continue with Google
                    </a>
                    <div style="margin-top:10px;text-align:center;color:rgba(255,255,255,0.5);font-size:0.85em;">Or use an App Password below</div>
                </div>

                <div id="imapSection">
                    <div class="form-group password-toggle">
                        <label for="appPassword">App Password</label>
                        <input 
                            type="password" 
                            id="appPassword" 
                            placeholder="Enter your app password"
                            autocomplete="current-password"
                        >
                        <button type="button" class="toggle-visibility" onclick="togglePassword()">👁️</button>
                    </div>

                    <button type="button" class="btn-secondary" onclick="showHelp()">
                        ❓ How to get an App Password?
                    </button>

                    <button type="submit" class="btn" id="connectBtn">
                        🚀 Connect &amp; Start
                    </button>
                </div>

                <!-- Status Messages -->
                <div id="statusMessage" class="status-message"></div>
            </form>

            <!-- Help Box -->
            <div id="helpBox" class="help-box">
                <h3>📱 How to Generate an App Password</h3>
                <div id="helpContent"></div>
            </div>

            <!-- Demo Mode Link -->
            <div class="demo-mode-link">
                Or <a href="frontend.html">try demo mode</a> with sample emails
            </div>
        </div>

        <div class="footer">
            <p>🔒 Secure • 🚀 Fast • 🤖 AI-Powered</p>
            <p style="margin-top: 10px; font-size: 0.9em;">
                <a href="https://github.com/moks-02/email-traiage" target="_blank">GitHub</a> • 
                <a href="README.md" target="_blank">Documentation</a>
            </p>
        </div>
    </div>

    <script>
        // Provider help content
        const providerHelp = {
            gmail: {
                icon: '🟦',
                steps: [
                    'Go to <a href="https://myaccount.google.com/security" target="_blank">myaccount.google.com/security</a>',
                    'Enable 2-Factor Authentication if not already enabled',
                    'Click on "App passwords" (under 2-Step Verification)',
                    'Select "Mail" and "Other (Custom name)"',
                    'Copy the 16-character password generated',
                    'Paste it in the App Password field above'
                ]
            },
            outlook: {
                icon: '🟪',
                steps: [
                    'Go to <a href="https://account.microsoft.com/security" target="_blank">account.microsoft.com/security</a>',
                    'Click on "Advanced security options"',
                    'Under "App passwords", click "Create a new app password"',
                    'Copy the generated password',
                    'Paste it in the App Password field above',
                    'Note: You may need to enable 2FA first'
                ]
            },
            yahoo: {
                icon: '🟣',
                steps: [
                    'Go to <a href="https://login.yahoo.com/account/security" target="_blank">Yahoo Account Security</a>',
                    'Click "Generate app password"',
                    'Select "Other App" and name it "Email Triage"',
                    'Click "Generate"',
                    'Copy the password shown',
                    'Paste it in the App Password field above'
                ]
            },
            icloud: {
                icon: '⚪',
                steps: [
                    'Go to <a href="https://appleid.apple.com" target="_blank">appleid.apple.com</a>',
                    'Sign in and go to "Security"',
                    'Under "App-Specific Passwords", click "Generate Password"',
                    'Enter a label (e.g., "Email Triage")',
                    'Copy the generated password',
                    'Paste it in the App Password field above'
                ]
            },
            aol: {
                icon: '🟡',
                steps: [
                    'Go to <a href="https://login.aol.com/account/security" target="_blank">AOL Account Security</a>',
                    'Click "Generate app password"',
                    'Select "Other App" and name it',
                    'Click "Generate"',
                    'Copy the password',
                    'Use it in the App Password field above'
                ]
            },
            custom: {
                icon: '⚙️',
                steps: [
                    'Contact your email provider for IMAP settings',
                    'You will need: IMAP server address and port',
                    'Generate an app password or use your regular password',
                    'Enter the app password in the field above'
                ]
            }
        };

        // Toggle password visibility
        function togglePassword() {
            const input = document.getElementById('appPassword');
            const btn = document.querySelector('.toggle-visibility');
            if (input.type === 'password') {
                input.type = 'text';
                btn.textContent = '🙈';
            } else {
                input.type = 'password';
                btn.textContent = '👁️';
            }
        }

        // Show help based on provider
        function showHelp() {
            const provider = document.getElementById('provider').value || 'gmail';
            const helpBox = document.getElementById('helpBox');
            const helpContent = document.getElementById('helpContent');
            
            const help = providerHelp[provider] || providerHelp.gmail;
            
            let html = `<p style="margin-bottom: 15px;">${help.icon} <strong>For ${provider === 'custom' ? 'Custom Provider' : provider.charAt(0).toUpperCase() + provider.slice(1)}:</strong></p><ol>`;
            help.steps.forEach(step => {
                html += `<li>${step}</li>`;
            });
            html += '</ol>';
            
            helpContent.innerHTML = html;
            helpBox.classList.add('show');
        }

        // Show/hide Google OAuth button based on provider selection
        function updateProviderUI() {
            const provider = document.getElementById('provider').value;
            const gmailSection = document.getElementById('gmailOAuthSection');
            const imapSection = document.getElementById('imapSection');
            const appPasswordInput = document.getElementById('appPassword');

            if (provider === 'gmail') {
                gmailSection.style.display = 'block';
                // App password becomes optional when Gmail OAuth is available
                appPasswordInput.removeAttribute('required');
            } else {
                gmailSection.style.display = 'none';
                appPasswordInput.setAttribute('required', 'required');
            }
        }

        document.getElementById('provider').addEventListener('change', function() {
            updateProviderUI();
            const helpBox = document.getElementById('helpBox');
            if (helpBox.classList.contains('show')) {
                showHelp();
            }
        });

        // Handle OAuth callback query params
        (function handleOAuthCallback() {
            const params = new URLSearchParams(window.location.search);
            if (params.get('gmail_connected') === '1') {
                // Show a status message while we fetch emails
                showStatus('🔄 Fetching your Gmail emails...', 'info');

                let gmailEmail = '';
                // Step 1: get the authenticated address
                fetch('http://localhost:8000/api/auth/gmail/me')
                    .then(r => r.json())
                    .then(data => {
                        gmailEmail = data.user_email || '';
                        localStorage.setItem('isConnected', 'true');
                        localStorage.setItem('provider', 'gmail_oauth');
                        localStorage.setItem('userEmail', gmailEmail);

                        // Step 2: ingest emails from Gmail.
                        // force=false (default) — skips the Gmail API if emails already in DB.
                        showStatus('📥 Checking for emails in database...', 'info');
                        return fetch('http://localhost:8000/api/ingest/gmail?max_emails=100', { method: 'POST' });
                    })
                    .then(r => r.json())
                    .then(ingestData => {
                        const skipped = ingestData.status === 'skipped';
                        const count   = ingestData.emails_fetched || 0;
                        const total   = ingestData.total_emails   || 0;

                        if (skipped) {
                            // Emails already in DB — skip classification, go straight to dashboard
                            showStatus(`✅ ${total} emails loaded from database.`, 'success');
                            return Promise.resolve(null);
                        }

                        showStatus(`⚙️ Classifying ${count} emails...`, 'info');
                        // Step 3: classify/prioritize only when we actually fetched new emails
                        return fetch(`http://localhost:8000/api/process-inbox?user_email=${encodeURIComponent(gmailEmail)}`, { method: 'POST' });
                    })
                    .then((res) => {
                        // Step 4: claim orphaned emails (skip if we skipped ingest)
                        if (res === null) return Promise.resolve();
                        return fetch(`http://localhost:8000/api/claim-emails?user_email=${encodeURIComponent(gmailEmail)}`, { method: 'POST' });
                    })
                    .then(() => { window.location.href = 'dashboard'; })
                    .catch(err => {
                        console.error('Gmail post-auth error:', err);
                        // Still redirect — user can see whatever was fetched
                        if (!localStorage.getItem('userEmail')) {
                            localStorage.setItem('isConnected', 'true');
                            localStorage.setItem('provider', 'gmail_oauth');
                            localStorage.setItem('userEmail', gmailEmail || 'Gmail (OAuth)');
                        }
                        window.location.href = 'dashboard';
                    });
                return;
            }
            if (params.get('gmail_error')) {
                const statusDiv = document.getElementById('statusMessage');
                statusDiv.className = 'status-message status-error show';
                statusDiv.textContent = '❌ Google login failed: ' + params.get('gmail_error');
            }
        })();

        // Auto-detect provider from email
        document.getElementById('emailAddress').addEventListener('blur', function() {
            const email = this.value.toLowerCase();
            const providerSelect = document.getElementById('provider');
            
            if (providerSelect.value === '') {
                if (email.includes('@gmail.com')) {
                    providerSelect.value = 'gmail';
                } else if (email.includes('@outlook.com') || email.includes('@hotmail.com') || email.includes('@live.com')) {
                    providerSelect.value = 'outlook';
                } else if (email.includes('@yahoo.com')) {
                    providerSelect.value = 'yahoo';
                } else if (email.includes('@icloud.com') || email.includes('@me.com')) {
                    providerSelect.value = 'icloud';
                } else if (email.includes('@aol.com')) {
                    providerSelect.value = 'aol';
                }
            }
        });

        // Show status message
        function showStatus(message, type = 'info') {
            const statusDiv = document.getElementById('statusMessage');
            statusDiv.className = `status-message status-${type} show`;
            statusDiv.innerHTML = message;
        }


        // Handle form submission
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('emailAddress').value;
            const password = document.getElementById('appPassword').value;
            const provider = document.getElementById('provider').value;
            const connectBtn = document.getElementById('connectBtn');
            const statusDiv = document.getElementById('statusMessage');
            
            // Disable button and show loading
            connectBtn.disabled = true;
            connectBtn.innerHTML = '<span class="loading-spinner"></span>Connecting...';
            showStatus('🔐 Authenticating...', 'info');
            
            try {
                // Step 0: Clear previous session data from backend (scoped to old user)
                const prevEmail = localStorage.getItem('userEmail') || '';
                await fetch(`http://localhost:8000/api/reset?user_email=${encodeURIComponent(prevEmail)}`, { method: 'POST' });
                localStorage.removeItem('userEmail');
                localStorage.removeItem('isConnected');
                localStorage.removeItem('provider');

                // Step 1: Connect via IMAP
                // We'll simulate the "Found X emails" part after we actually get them, 
                // or we can't know the number before fetching. 
                // However, for UX, we can show "Authenticating..." then "Fetching..."
                
                const response = await fetch('http://localhost:8000/api/ingest/imap', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        email_address: email,
                        password: password,
                        host: provider === 'custom' ? undefined : undefined, 
                        provider: provider || undefined,
                        max_emails: 100, // fetching 100 as per requested text
                        unread_only: false
                    })
                });
                
                if (!response.ok) {
                    const error = await response.json();
                    let detail = error.detail || 'Connection failed';
                    if (Array.isArray(detail)) {
                        detail = detail.map(err => `${err.loc.join('.')}: ${err.msg}`).join(', ');
                    } else if (typeof detail === 'object') {
                        detail = JSON.stringify(detail);
                    }
                    throw new Error(detail);
                }
                
                const result = await response.json();
                const totalEmails = result.emails_fetched || 0; // Ensure fallback
                
                showStatus(`✅ Successfully connected and authenticated`, 'success');
                await new Promise(r => setTimeout(r, 800));
                
                showStatus(`📧 Found ${totalEmails} emails, fetching...`, 'info');
                await new Promise(r => setTimeout(r, 800));

                // Step 2: Simulate Processing Progress
                // Since the backend processes fast, we'll simulate the "Processed X/Y" counting
                // to give the user the feedback they asked for.
                
                const step = Math.ceil(totalEmails / 10);
                for (let i = 10; i <= totalEmails; i += step) {
                    showStatus(`
                        <div style="margin-bottom: 5px;">📧 Found ${totalEmails} emails, fetching...</div>
                        <div style="color: #4a5568; font-size: 0.9em; padding-left: 10px;">
                            Processed ${i}/${totalEmails} emails...
                        </div>
                    `, 'info');
                    await new Promise(r => setTimeout(r, 150)); // Fast ticks
                }
                
                // Actual processing call
                const processResponse = await fetch(`http://localhost:8000/api/process-inbox?user_email=${encodeURIComponent(email)}`, {
                    method: 'POST'
                });
                
                if (!processResponse.ok) {
                    throw new Error('Processing failed');
                }
                
                // Success!
                showStatus(`✅ Successfully fetched ${totalEmails} emails<br>✅ Disconnected from IMAP server`, 'success');
                
                // Store connection info (for future use)
                localStorage.setItem('userEmail', email);
                localStorage.setItem('isConnected', 'true');
                if (result.provider) localStorage.setItem('provider', result.provider);

                // Claim any unowned emails so they appear under this account
                await fetch(`http://localhost:8000/api/claim-emails?user_email=${encodeURIComponent(email)}`, { method: 'POST' });

                // Redirect to dashboard after 2 seconds
                setTimeout(() => {
                    window.location.href = '/dashboard';
                }, 2000);
                
            } catch (error) {
                console.error('Connection error:', error);
                showStatus(`❌ Error: ${error.message}. Please check your credentials and try again.`, 'error');
                connectBtn.disabled = false;
                connectBtn.innerHTML = '🚀 Connect & Start';
            }
        });

        // Check if already connected
        window.addEventListener('load', function() {
            if (localStorage.getItem('isConnected') === 'true') {
                const email = localStorage.getItem('userEmail');
                showStatus(`👋 Welcome back, ${email}! <a href="/dashboard" style="color: inherit; font-weight: bold; text-decoration: underline;">Go to Dashboard</a>`, 'success');
            }
        });
    </script>
</body>
</html>
